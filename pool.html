<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>회원 관리 | 대.세.는 소개팅</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/pool.css" />
  <script src="js/backend-config.js" defer></script>
  <script src="js/admin-session.js" defer></script>
  <script src="js/pool.js" defer></script>
</head>
<body>
  <main class="admin-shell pool-shell">
    <header class="admin-header"><div><p>대.세.는 소개팅</p><h1>관리자</h1></div><button type="button" data-logout hidden>로그아웃</button></header>
    <nav class="admin-tabs" aria-label="관리자 메뉴" data-admin-nav hidden><a href="admin.html">신청 관리</a><a href="pool.html" aria-current="page">회원 관리</a></nav>
    <p class="admin-message" data-message role="status" tabindex="-1" hidden></p>
    <form class="admin-login" data-login method="post" action="/api/admin">
      <h2>관리자 로그인</h2>
      <p>승인 회원의 매칭 검토 정보는 등록된 관리자만 확인할 수 있습니다.</p>
      <label for="pool-email">이메일</label><input id="pool-email" name="email" type="email" autocomplete="username" maxlength="254" required />
      <label for="pool-password">비밀번호</label><input id="pool-password" name="password" type="password" autocomplete="current-password" maxlength="1024" required />
      <button type="submit" class="button button-primary">로그인</button>
    </form>
    <section data-workspace hidden>
      <div class="pool-board">
        <section class="pool-column" aria-labelledby="men-title"><div class="pool-column-title"><span>남</span><div><p>MEN</p><h2 id="men-title">남자 회원</h2></div><strong data-men-count>0</strong></div><div class="pool-list" data-men></div></section>
        <section class="pool-column" aria-labelledby="women-title"><div class="pool-column-title"><span>여</span><div><p>WOMEN</p><h2 id="women-title">여자 회원</h2></div><strong data-women-count>0</strong></div><div class="pool-list" data-women></div></section>
      </div>
    </section>
    <dialog class="pool-dialog" data-compare><div class="pool-dialog-header"><div><p data-dialog-kicker>PROFILE COMPARISON</p><h2 data-dialog-title>선택 회원 비교</h2></div><button type="button" aria-label="상세 창 닫기" data-close>닫기</button></div><div class="pool-comparison" data-comparison></div></dialog>
  </main>
</body>
</html>
