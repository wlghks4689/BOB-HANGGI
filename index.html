<!doctype html>
<html lang="ko" class="landing-page">

    <link rel="icon" href="data:," />

  <body>
    <main class="landing-poster" aria-label="대.세.는 소개팅">
      <img src="assets/landing-original.png" width="941" height="1672" fetchpriority="high"
        alt="대.세.는 소개팅. 대전·세종 프라이빗 매칭. 만남으로 시작하는 소개. 당신의 만남이, 인생에서 가장 빛나는 시작이 되기를." />
      <nav class="landing-nav" aria-label="소개 및 개인정보">
        <button class="landing-nav-item introduce-trigger" type="button" aria-haspopup="dialog" aria-controls="introduce-dialog">Introduce</button>
        <a class="landing-nav-item" href="privacy.html">Privacy</a>
      </nav>
      <!-- The button artwork belongs to the original image. Only its hit area is added. -->
      <a class="poster-apply" href="apply.html" aria-label="소개 신청하기"></a>
    </main>
    <dialog class="introduce-dialog" id="introduce-dialog" aria-labelledby="introduce-title">
      <div class="introduce-dialog-inner">
        <header class="introduce-heading">
          <p class="introduce-kicker">OPERATOR</p>
          <button class="introduce-close" type="button" aria-label="운영자 소개 닫기">×</button>
        </header>
        <h1 id="introduce-title">INTRODUCE</h1>
        <p class="introduce-operator"><strong>지환</strong><span>대.세.는 소개팅 운영자</span></p>
        <div class="introduce-copy">
          <p>제가 생각하는 소개팅에서 가장 중요한 가치는<br />‘만남’이라고 생각했습니다.</p>
          <p>제가 살고 있는 대전·세종 지역에서,<br />좋은 인연의 다리가 되어주고, 믿을 수 있는 만남을 제공하는<br />그런 서비스가 되어보고자 시작하였습니다.</p>
          <p>대.세.는 소개팅은 채팅이 아닌,<br />제가 직접 신청서를 확인하고<br />만남을 주선하는 방식으로 운영을 준비하고 있습니다.</p>
        </div>
        <footer class="introduce-contact">
          <span>운영 문의</span>
          <!-- TODO: 도메인 문의 주소를 개설한 뒤 링크를 연결한다. -->
          <span class="introduce-contact-link">문의하기</span>
        </footer>
      </div>
    </dialog>
    <script src="js/introduce.js"></script>
