<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>신청 관리 | 대.세.는 소개팅</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <script src="js/backend-config.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header"><div><p>대.세.는 소개팅</p><h1>신청 관리</h1></div><button type="button" data-logout hidden>로그아웃</button></header>
    <p class="admin-message" data-message role="status" tabindex="-1"></p>
    <form class="admin-login" data-password-reset hidden>
      <h2>관리자 비밀번호 설정</h2>
      <p>12자 이상의 새 비밀번호를 입력해주세요. 저장 후 관리자 로그인 화면으로 돌아갑니다.</p>
      <label for="new-password">새 비밀번호</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required />
      <label for="new-password-confirm">새 비밀번호 확인</label><input id="new-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required />
      <button type="submit" class="button button-primary">비밀번호 저장</button>
    </form>
    <form class="admin-login" data-login method="post" action="/api/admin">
      <h2>관리자 로그인</h2>
      <p>등록된 관리자만 신청서와 사진을 확인할 수 있습니다. 새로고침하거나 창을 닫으면 다시 로그인해야 합니다.</p>
      <label for="admin-email">이메일</label><input id="admin-email" name="email" type="email" autocomplete="username" maxlength="254" required />
      <label for="admin-password">비밀번호</label><input id="admin-password" name="password" type="password" autocomplete="current-password" maxlength="1024" required />
      <button type="submit" class="button button-primary">로그인</button>
    </form>
    <section data-workspace hidden>
      <div class="admin-toolbar">
        <label for="filter-status">신청 상태</label>
        <select id="filter-status" data-filter><option value="">전체</option><option value="submitted">접수</option><option value="reviewing">검토 중</option><option value="approved">승인</option><option value="rejected">미승인</option></select>
        <button type="button" data-refresh>새로고침</button>
        <button type="button" data-cleanup>대기 중인 사진 삭제 재시도</button>
      </div>
      <p class="admin-help">신청 승인 전 사진을 직접 확인해주세요. 전화번호는 입력값이며 본인 인증을 거친 번호가 아닙니다.</p>
      <div class="admin-layout">
        <section aria-label="신청 목록">
          <div data-list class="admin-list"></div>
          <nav class="admin-pagination" aria-label="신청 목록 페이지"><button type="button" data-prev disabled>이전</button><span data-page>1페이지</span><button type="button" data-next disabled>다음</button></nav>
        </section>
        <section class="admin-detail" aria-label="신청 상세" data-detail tabindex="-1"><p>신청서를 선택해주세요.</p></section>
      </div>
    </section>
    <dialog data-delete-dialog>
      <h2>신청서 삭제</h2>
      <p>신청 정보·연락처·동의 기록을 삭제하고 사진도 삭제 처리합니다. 되돌릴 수 없습니다.</p>
      <p>삭제할 접수번호: <strong data-delete-id></strong></p>
      <label for="delete-confirm">접수번호를 그대로 입력해주세요.</label><input id="delete-confirm" autocomplete="off" />
      <div class="admin-actions"><button type="button" data-delete-cancel>취소</button><button type="button" class="danger" data-delete-confirm>삭제</button></div>
    </dialog>
  </main>
</body>
</html>
